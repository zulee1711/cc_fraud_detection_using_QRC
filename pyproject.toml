[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-fraud-detection-qrc"
version = "0.1.0"
description = "Quantum Reservoir Computing (QRC) for credit-card fraud detection."
readme = "Readme.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"

# Everything the project imports. Kept as one flat list so a single
# `pip install -e .` gives a working checkout — no extras to remember.
dependencies = [
    # quantum core
    "qiskit",
    "spin-pulse",
    # numerics / data
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "joblib",
    # plotting
    "matplotlib",
    "seaborn",
    # hyperparameter search (experiments)
    "optuna",
    # notebooks under notebook/ and examples/
    "jupyterlab",
]

[tool.setuptools.packages.find]
include = ["qrc*"]  # experiments/ is scripts, deliberately not packaged
